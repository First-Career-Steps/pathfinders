name: Deploy FirstCareerSteps production
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/deploy-production.yml]
permissions:
  contents: read
concurrency:
  group: firstcareersteps-production-release
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'First-Career-Steps/pathfinders' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Publish latest main using the existing Vercel project
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const token = process.env.VERCEL_TOKEN?.trim();
          if (!token) {
            console.error('::error::The repository does not have a VERCEL_TOKEN deployment secret. No deployment was submitted.');
            process.exit(1);
          }
          const teamId = 'team_L4WmnItfnOGDfL0RiGSCtQjw';
          const projectId = 'prj_3buBGhkO0Q2zrEWfjy0hvcbSPsbD';
          const auth = { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' };
          async function api(path, options = {}) {
            const response = await fetch(`https://api.vercel.com${path}${path.includes('?') ? '&' : '?'}teamId=${teamId}`, {
              ...options, headers: auth, signal: AbortSignal.timeout(30000), redirect: 'error',
            });
            const data = await response.json();
            if (!response.ok) throw new Error(`Vercel HTTP ${response.status}: ${data.error?.code || 'request_failed'}`);
            return data;
          }
          const project = await api(`/v9/projects/${projectId}`);
          if (project.id !== projectId || project.name !== 'pathfinders-schv') throw new Error('Unexpected project; stopped');
          const deployment = await api('/v13/deployments', {
            method: 'POST', body: JSON.stringify({
              name: 'pathfinders-schv', project: projectId, target: 'production',
              deploymentId: 'dpl_7kD9VMDBLuQPHM9kSgFGp488ZaHg', withLatestCommit: true,
            }),
          });
          console.log(`Submitted production deployment ${deployment.id}`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Deployment: ${deployment.id}\n\n`);
          for (let attempt = 0; attempt < 100; attempt++) {
            const current = await api(`/v13/deployments/${deployment.id}`);
            const state = current.readyState || current.state;
            if (state === 'READY') {
              console.log(`Production READY: ${current.url}; source ${current.meta?.githubCommitSha || 'unreported'}`);
              appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Production ready: https://${current.url}\n\nSource: ${current.meta?.githubCommitSha || 'unreported'}\n`);
              process.exit(0);
            }
            if (['ERROR','CANCELED'].includes(state)) throw new Error(`Deployment ${state}`);
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          throw new Error('Deployment submitted but did not finish within this check');
          JS
