name: Privacy hardening verification
on:
  push:
    branches: [security/student-privacy-20260924]
    paths: [scripts/privacy-finalize.py, .github/workflows/privacy-bootstrap.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'First-Career-Steps/pathfinders'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-public-key
      SUPABASE_SERVICE_ROLE_KEY: test-only-server-key-not-a-real-credential
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: sk-test-build-only-not-a-real-key
      STRIPE_SECRET_KEY: sk_test_build_only_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_build_only_not_a_real_key
      RESEND_API_KEY: re_build_only_not_a_real_key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/student-privacy-20260924
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/privacy-finalize.py
      - run: npm ci
      - name: Tests
        run: node --import tsx --test tests/student-privacy.test.ts tests/privacy-boundaries.test.ts && npm run test:resume-ai && npm run test:conversion
      - name: Type check and production build
        run: npx tsc --noEmit && npm run build
      - name: Built-site privacy guards
        run: |
          npm run start > /tmp/fcs-smoke.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:3000/privacy; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base='http://localhost:3000';
          for (const path of ['/privacy','/terms']) {
            const response=await fetch(base+path); assert.equal(response.status,200);
            const text=await response.text(); assert.match(text,/OpenAI/); assert.match(text,/Pathfinders Ventures LLC/);
          }
          const headers={Origin:base,'Content-Type':'application/json'};
          const del=(origin,confirmation)=>fetch(base+'/api/account',{method:'DELETE',headers:{...headers,Origin:origin},body:JSON.stringify({confirmation})});
          assert.equal((await del('https://untrusted.example','DELETE')).status,403);
          assert.equal((await del(base,'NO')).status,400);
          assert.equal((await del(base,'DELETE')).status,401);
          assert.equal((await fetch(base+'/api/diag/webhook-check')).status,404);
          assert.equal((await fetch(base+'/api/private-file?bucket=resumes&path=11111111-1111-4111-8111-111111111111%2Fx.pdf')).status,401);
          assert.equal((await fetch(base+'/api/ai/generate-roadmap',{method:'POST',headers,body:JSON.stringify({careerGoal:'Teacher',userId:'11111111-1111-4111-8111-111111111111'})})).status,401);
          for(const path of ['/dashboard/settings','/resume/11111111-1111-4111-8111-111111111111','/builder/step-1']) {
            const response=await fetch(base+path,{redirect:'manual'}); assert.equal(response.status,307); assert.match(response.headers.get('location')||'',/\/login/);
          }
          console.log('PASS legal pages; deletion safeguards; private files; private pages; retired diagnostics; roadmap authentication');
          JS
      - name: Save verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests sql docs package.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: close legacy diagnostics and enforce all student boundaries'
            git push origin HEAD:security/student-privacy-20260924
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: privacy-verification
          path: |
            src
            tests
            sql
            docs
            package.json
            package-lock.json
            tsconfig.json
          retention-days: 3
