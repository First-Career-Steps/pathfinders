name: Privacy hardening verification
on:
  push:
    branches: [security/student-privacy-20260924]
    paths: [scripts/privacy-apply.py, .github/workflows/privacy-bootstrap.yml]
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'First-Career-Steps/pathfinders'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-only-public-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
      OPENAI_API_KEY: sk-test-build-only-not-a-real-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/student-privacy-20260924
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact source transformations
        run: python3 scripts/privacy-apply.py
      - run: npm ci
      - name: Privacy tests
        run: node --import tsx --test tests/student-privacy.test.ts
      - name: Existing tests
        run: npm run test:resume-ai && npm run test:conversion
      - name: Type check and production build
        run: npx tsc --noEmit && npm run build
      - name: Built-site HTTP privacy smoke tests
        run: |
          npm run start > /tmp/fcs-smoke.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 40); do
            if curl -s -o /dev/null http://localhost:3000/privacy; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://localhost:3000';
          for (const path of ['/privacy', '/terms']) {
            const response = await fetch(base + path);
            assert.equal(response.status, 200);
            const html = await response.text();
            assert.match(html, /OpenAI/);
            assert.match(html, /Pathfinders Ventures LLC/);
            console.log('PASS public legal page', path);
          }
          const headers = { Origin: base, 'Content-Type': 'application/json' };
          assert.equal((await fetch(base + '/api/account', { method: 'DELETE', headers: { ...headers, Origin: 'https://untrusted.example' }, body: JSON.stringify({ confirmation: 'DELETE' }) })).status, 403);
          assert.equal((await fetch(base + '/api/account', { method: 'DELETE', headers, body: JSON.stringify({ confirmation: 'NO' }) })).status, 400);
          assert.equal((await fetch(base + '/api/account', { method: 'DELETE', headers, body: JSON.stringify({ confirmation: 'DELETE' }) })).status, 401);
          const file = await fetch(base + '/api/private-file?bucket=resumes&path=11111111-1111-4111-8111-111111111111%2Fresume.pdf');
          assert.equal(file.status, 401);
          assert.match(file.headers.get('cache-control') || '', /no-store/);
          const resume = await fetch(base + '/resume/11111111-1111-4111-8111-111111111111', { redirect: 'manual' });
          assert.equal(resume.status, 307);
          assert.match(resume.headers.get('location') || '', /\/login/);
          console.log('PASS deletion origin/confirmation/authentication; private file and resume guards');
          JS
      - name: Save verified changes on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests sql docs package.json
          if ! git diff --cached --quiet; then
            git commit -m 'security: enforce private student accounts and real deletion'
            git push origin HEAD:security/student-privacy-20260924
          fi
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: privacy-verification
          path: |
            src
            tests
            sql
            docs
            package.json
            package-lock.json
            tsconfig.json
          retention-days: 3
